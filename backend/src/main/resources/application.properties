spring.application.name=roomsplit

# Veza na bazu: vrijednosti dolaze iz varijabli okruženja (ne pišu se u kod).
# U produkciji se postave DB_URL, DB_USER i DB_PASSWORD; lokalno ih nema,
# pa se koristi lokalni Postgres iz docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
spring.datasource.username=${DB_USER:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

# Šemu mijenja samo Flyway; Hibernate samo provjerava da se entiteti slažu s bazom
spring.jpa.hibernate.ddl-auto=validate

# JWT: secret dolazi iz varijable okruženja (najmanje 32 znaka), nikad iz koda
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Odakle React smije zvati API (Vite dev server po defaultu)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Ne drži otvorenu bazu tokom renderovanja odgovora (izbjegava lazy-loading u kontrolerima)
spring.jpa.open-in-view=false
